<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Logged Out - akserver</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom, #f5f7fa, #c3cfe2);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .container {
      background: white;
      padding: 36px 30px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      width: 95%;
      max-width: 400px;
      text-align: center;
      animation: scaleIn 0.5s ease-in-out;
    }
    @keyframes scaleIn {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .header-logo {
      width: 65px;
      margin: 0 auto 12px auto;
    }
    h2 {
      margin-bottom: 25px;
      font-size: 1.8rem;
      font-weight: 700;
      color: #28a745; /* Green for success */
    }
    p {
      color: #555;
      margin-bottom: 28px;
    }
    a.button {
      display: inline-block;
      background: linear-gradient(to right, #0056b3, #007bff);
      color: white;
      text-decoration: none;
      padding: 12px;
      width: 100%;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s ease;
      box-shadow: 0 6px 15px rgba(0, 123, 255, 0.3);
    }
    a.button:hover {
      background: linear-gradient(to right, #004494, #0066cc);
      box-shadow: 0 6px 20px rgba(0, 86, 179, 0.4);
    }
    .footer {
      font-size: 0.75em;
      color: #777;
      margin-top: 25px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/static/akserver_logo.png" alt="akserver Logo" class="header-logo" />
    <h2>Logged Out</h2>
    <p>You have been successfully logged out.</p>
    <a href="/login" class="button">Return to Login Page</a>
    <div class="footer">
      © 2025 akserver. All rights reserved.
    </div>
  </div>
</body>
</html>
